<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <title>TGBot Admin</title>
  <!-- ★ 使用国内镜像 CDN 加载 Material Symbols（解决 fonts.googleapis.com 被拦截问题） -->
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- 备用：如果 loli.net 也失败，使用 jsdelivr CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/material-symbols-outlined@latest/index.min.css" onerror="this.remove()" />
  <!-- Telegram Mini App SDK：异步加载，不阻塞页面渲染 -->
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
