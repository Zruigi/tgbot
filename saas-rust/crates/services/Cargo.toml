[package]
name = "tgbot-services"
version.workspace = true
edition.workspace = true

[features]
default = []
# These modules are retained only for historical source compatibility. They
# contain no implementation and are deliberately excluded from the Beta/app
# release graph; enabling this feature requires an explicit legacy audit.
legacy-stubs = []

[dependencies]
tgbot-domain = { workspace = true }
tgbot-repos = { workspace = true }
tgbot-integrations = { workspace = true }

sqlx = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
# 广告文本归一化哈希 — 必须与 Python services/ad_text.py 的 MD5 位级一致
md-5 = "0.10"
hex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
