[package]
name = "tgbot-app"
version.workspace = true
edition.workspace = true

[features]
default = []
dev-polling = ["dep:teloxide"]
beta-test-tools = ["dep:reqwest"]

[[bin]]
name = "tgbot-app"
path = "src/main.rs"

[[bin]]
name = "bot-polling"
path = "src/bin/bot-polling.rs"
required-features = ["dev-polling"]

[[bin]]
name = "beta-seed-test-bot"
path = "src/bin/beta-seed-test-bot.rs"
required-features = ["beta-test-tools"]

[[bin]]
name = "beta-real-bot-bridge"
path = "src/bin/beta-real-bot-bridge.rs"
required-features = ["beta-test-tools"]

[dependencies]
tgbot-http = { workspace = true }
tgbot-domain = { workspace = true }
tgbot-repos = { workspace = true }
tgbot-services = { workspace = true }
tgbot-agent = { workspace = true }
tgbot-integrations = { workspace = true }
tgbot-workers = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
teloxide = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
