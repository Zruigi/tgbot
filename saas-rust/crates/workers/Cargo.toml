[package]
name = "tgbot-workers"
version.workspace = true
edition.workspace = true

[features]
default = []
# ai_worker and monitor_worker are historical, unregistered workers. They are
# excluded from the formal scheduler/app graph until their data paths are
# implemented and tenant-audited.
legacy-workers = ["tgbot-repos/legacy-stubs"]

[dependencies]
tgbot-domain = { workspace = true }
tgbot-repos = { workspace = true }
tgbot-services = { workspace = true }
tgbot-integrations = { workspace = true }

tokio = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
cron = { workspace = true }
async-trait = { workspace = true }
